[project]
name = "hermes-104-hunter"
version = "0.1.0"
description = "🏹 Hermes 專屬 104 人力銀行求職特助 MCP：輕量級 API 搜尋、真實競爭人數逆推演算法、自薦信語氣繼承與 Hit-in-the-Loop 代填投遞"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "HCH725" }
]
dependencies = [
    "browser-cookie3>=0.19.1",
    "httpx>=0.27.0",
    "mcp>=1.3.0",
    "playwright>=1.40.0",
    "pydantic>=2.0",
]

[project.scripts]
hermes-104-hunter = "hermes_104_hunter.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
